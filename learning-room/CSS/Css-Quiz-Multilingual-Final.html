des("container-type")&&e.includes("inline-size")&&e.includes("clamp")},{id:16,type:"choice",sampleAnswer:"@media = viewport, @container = parent container",correctChoice:0},{id:17,type:"number",sampleAnswer:"50",answerNumber:50}],Om={ko:{ui:{title:"CSS Quiz Multilingual",score:"점수",progress:"진행",check:"정답 확인",hintBtn:"힌트",showAnswer:"정답 보기",next:"다음 →",correct:"정답입니다! \uD83C\uDF89",wrong:"오답입니다",hintLabel:"힌트",explanationLabel:"설명",answerLabel:"정답 예시",chapters:"챕터",codePlaceholder:"예) font-size: clamp(16px, 3vw, 28px);",numberPlaceholder:"숫자만 입력",typeCode:"코드 작성",typeChoice:"객관식",typeNumber:"계산",completed:"완료",of:"/",emptyChoice:"옵션을 선택해주세요"},chapters:[{title:"Clamp 기초",short:"clamp",problems:[{title:"폰트 크기를 최소 16px, 선호 3vw, 최대 28px로",desc:"font-size 속성에 clamp()를 사용해 뷰포트에 따라 유동적으로 변하지만 최소/최대값을 지키는 폰트를 만들어보세요.",hint:"clamp(최소, 선호, 최대) 순서. font-size: clamp(16px, 3vw, 28px);",explanation:"clamp()는 min, preferred, max 순서입니다. 브라우저는 3vw 값을 16px과 28px 사이로 제한합니다. 작은 화면에서도 가독성을 지키고 큰 화면에서도 너무 커지지 않습니다."},{title:"뷰포트가 400px일 때 clamp(14px,5vw,24px) 계산값은?",desc:"뷰포트 너비 400px 기준, clamp(14px, 5vw, 24px)의 최종 px 값을 숫자로만 입력하세요.",hint:"5vw = 400 * 0.05 = 20px. 이 값이 14px~24px 사이에 있으면 그대로 사용됩니다.",explanation:"5vw는 20px이며, 최소 14px와 최대 24px 사이에 있으므로 최종 결과는 20px입니다. clamp는 선호값을 최소/최대 사이로 클램핑합니다."},{title:"clamp() 인자 순서는?",desc:"올바른 clamp() 문법을 고르세요.",hint:"작은 값 → 유동 값 → 큰 값 순서로 기억하세요.",explanation:"정답은 clamp(최소, 선호, 최대)입니다. 예: clamp(16px, 4vw, 32px). 순서를 바꾸면 의도치 않게 항상 최소나 최대값만 적용됩니다.",options:["clamp(최대, 선호, 최소)","clamp(최소, 선호, 최대)","clamp(선호, 최소, 최대)"]}]},{title:"Calc + Clamp",short:"calc",problems:[{title:"너비를 최소 200px, 선호 calc(50% - 20px), 최대 600px로",desc:"width에 clamp()와 calc()를 조합해 보세요. 사이드바를 제외한 절반에서 20px을 뺀 유동 너비, 하지만 200px~600px 제한.",hint:"width: clamp(200px, calc(50% - 20px), 600px); calc 내부 띄어쓰기 필수!",explanation:"clamp 내부에 calc()를 넣을 수 있습니다. calc(50% - 20px)는 부모의 절반에서 20px을 뺀 값. 이를 최소/최대값으로 감싸 안전한 반응형을 만듭니다."},{title:"컨테이너 800px일 때 calc(100% - 40px)는?",desc:"부모 너비 800px일 때 calc(100% - 40px)의 결과 px 값은?",hint:"100%는 부모 전체, 즉 800px입니다. 여기서 40px을 빼세요.",explanation:"800px - 40px = 760px. calc()는 서로 다른 단위(%)와 (px)를 계산할 수 있게 해줍니다."},{title:"clamp와 calc 중첩 가능?",desc:"다음 중 올바른 중첩 설명을 고르세요.",hint:"CSS는 두 함수를 서로 안에 넣는 것을 허용합니다.",explanation:"calc() 안에 clamp()를 넣거나, clamp() 안에 calc()를 넣는 것 모두 가능합니다. 예: clamp(200px, calc(10vw + 20px), 600px). 브라우저 지원도 훌륭합니다.",options:["calc 안에 clamp, clamp 안에 calc 모두 가능","clamp 안에 calc만 가능","중첩 불가능"]}]},{title:"Flex & Grid",short:"flex/grid",problems:[{title:"flex-basis를 clamp(200px, 30%, 400px)로",desc:"유연한 카드 레이아웃: flex-basis에 clamp를 사용해 최소 200px, 선호 30%, 최대 400px을 지정하세요.",hint:"flex-basis: clamp(200px, 30%, 400px); 또는 flex: 1 1 clamp(200px, 30%, 400px);",explanation:"flex-basis에 clamp를 쓰면 아이템이 너무 작아지거나 커지는 것을 방지하면서도 30% 비율을 유지합니다. flex: 1 1 ... 로 grow/shrink도 함께 지정하면 완벽합니다."},{title:"반응형 그리드 최소 200px 컬럼 정의는?",desc:"컨테이너에 따라 컬럼 수가 자동으로 변하는 그리드를 만들 때 가장 적합한 방법은?",hint:"auto-fit/fill과 minmax 조합을 생각해보세요. clamp도 가능하지만 minmax가 더 관용적입니다.",explanation:"repeat(auto-fit, minmax(200px, 1fr))는 각 컬럼이 최소 200px을 유지하면서 남은 공간을 나눠 갖게 합니다. clamp()를 minmax 안에 넣으면 더 정교한 제어가 가능합니다.",options:["repeat(auto-fit, minmax(200px, 1fr))","grid-template-columns: 200px 200px 200px","grid-template-columns: clamp(200px, 50%, 1fr)"]},{title:"1000px 컨테이너, gap 20px, 3개 아이템 너비는?",desc:"flex 컨테이너 1000px, gap 20px, 아이템 3개를 균등 배치할 때 calc로 계산한 한 아이템 너비 (소수점 버림)는?",hint:"gap은 아이템 사이에 2개 존재: 20px * 2 = 40px. (1000 - 40) / 3 = ?",explanation:"(1000 - 40) / 3 = 960 / 3 = 320px. 실무에서는 width: calc((100% - 40px) / 3) 처럼 작성합니다."}]},{title:"Position",short:"position",problems:[{title:"sticky 헤더 top 0, 패딩 clamp(12px, 2vw, 24px)",desc:"상단에 고정되는 헤더: position: sticky, top: 0, 그리고 반응형 패딩 clamp(12px, 2vw, 24px)를 작성하세요.",hint:"position: sticky; top: 0; padding: clamp(12px, 2vw, 24px); 한 번에 작성.",explanation:"sticky는 부모 컨테이너 안에서 스크롤 시 고정됩니다. top:0은 고정 위치, clamp 패딩은 화면 크기에 따라 여백을 유동적으로 조절해줍니다."},{title:"sticky vs fixed 차이는?",desc:"두 포지셔닝의 차이를 올바르게 설명한 것을 고르세요.",hint:"sticky는 부모를 벗어나지 못하고, fixed는 뷰포트에 고정됩니다.",explanation:"position: sticky는 원래 위치에서 스크롤 시 지정된 위치에 붙고 부모를 벗어나면 해제됩니다. fixed는 항상 뷰포트 기준 고정입니다.",options:["둘 다 뷰포트 기준 고정","sticky는 부모 안에서 고정, fixed는 뷰포트 고정","fixed는 부모 안에서 고정, sticky는 뷰포트 고정"]},{title:"높이 800px 뷰포트, clamp(10px, 5vh, 50px)는?",desc:"뷰포트 높이 800px일 때 clamp(10px, 5vh, 50px)의 최종 값은?",hint:"5vh = 800 * 0.05 = 40px. 최소/최대 사이에 있나요?",explanation:"5vh는 40px로, 10px~50px 사이이므로 결과는 40px입니다. vh는 뷰포트 높이 기준 단위입니다."}]},{title:"Transform & Animation",short:"transform",problems:[{title:"translateX를 clamp(0px, 5vw, 100px)로",desc:"요소를 X축으로 유동적으로 이동: transform: translateX(clamp(0px, 5vw, 100px)); 를 작성하세요.",hint:"transform: translateX(clamp(0px, 5vw, 100px));",explanation:"transform 값 안에도 clamp()를 사용할 수 있습니다. 뷰포트가 커질수록 5vw만큼 이동하지만 0px~100px을 넘지 않아 과도한 이동을 방지합니다."},{title:"유동 애니메이션에 clamp 활용?",desc:"부드러운 반응형 애니메이션을 위해 clamp를 올바르게 사용하는 방법은?",hint:"transition 자체에는 clamp를 못 쓰지만, transform 값에는 쓸 수 있습니다.",explanation:"transition-duration에는 clamp를 쓸 수 없지만, transform: translateX(clamp(...)) 처럼 애니메이션되는 속성값에 clamp를 사용하면 뷰포트에 따라 이동 거리가 유동적으로 변하는 애니메이션이 됩니다.",options:["transition: clamp(0.2s, 2vw, 1s)","animation: clamp(0s, 5vw, 10s)","transform 값에 clamp() 사용: translateX(clamp(0px, 5vw, 100px))"]},{title:"600px 뷰포트, translateX 5vw는 몇 px?",desc:"뷰포트 600px일 때 transform: translateX(5vw)의 이동량은?",hint:"5vw = 600 * 0.05",explanation:"600px의 5%는 30px. 따라서 translateX(5vw)는 30px 이동합니다."}]},{title:"Container Queries",short:"container",problems:[{title:"container-type과 clamp 폰트 조합",desc:"카드가 container-type: inline-size를 갖고, @container에서 clamp 폰트를 사용하는 코드를 작성하세요.",hint:".card { container-type: inline-size; } @container (min-width: 300px) { font-size: clamp(14px, 4cqw, 20px); }",explanation:"container-type으로 컨테이너를 정의하면 @container 쿼리로 부모 크기에 반응할 수 있습니다. cqw는 컨테이너 너비 기준 단위이며 clamp와 결합하면 컴포넌트 자체가 반응형이 됩니다."},{title:"@media vs @container 차이는?",desc:"두 쿼리의 차이를 올바르게 설명한 것은?",hint:"@media는 뷰포트, @container는 부모 컨테이너 기준입니다.",explanation:"@media는 전체 뷰포트 크기에 반응하고, @container는 가장 가까운 container-type을 가진 부모 크기에 반응합니다. 컴포넌트 기반 반응형에 @container가 더 적합합니다.",options:["@media는 뷰포트 기준, @container는 부모 컨테이너 기준","@container는 뷰포트 기준, @media는 부모 기준","둘 다 동일"]},{title:"500px 컨테이너, 10cqw는 몇 px?",desc:"컨테이너 너비 500px일 때 10cqw의 값은?",hint:"1cqw = 컨테이너 너비의 1%. 10cqw는 10%.",explanation:"500px * 0.1 = 50px. cqw는 container query width 단위로, 부모 컨테이너 기준 1%를 의미합니다."}]}]},en:{ui:{title:"CSS Quiz Multilingual",score:"Score",progress:"Progress",check:"Check answer",hintBtn:"Hint",showAnswer:"Show answer",next:"Next →",correct:"Correct! \uD83C\uDF89",wrong:"Wrong answer",hintLabel:"Hint",explanationLabel:"Explanation",answerLabel:"Sample answer",chapters:"Chapters",codePlaceholder:"e.g. font-size: clamp(16px, 3vw, 28px);",numberPlaceholder:"Enter number only",typeCode:"Code",typeChoice:"Choice",typeNumber:"Calc",completed:"Done",of:"/",emptyChoice:"Please select an option"},chapters:[{title:"Clamp Basics",short:"clamp",problems:[{title:"Make font size min 16px, preferred 3vw, max 28px",desc:"Use clamp() for font-size to create fluid typography that respects min and max bounds.",hint:"Order is clamp(min, preferred, max). Example: font-size: clamp(16px, 3vw, 28px);",explanation:"clamp() takes min, preferred, max. Browser clamps the 3vw value between 16px and 28px. Readable on small screens, not too huge on large screens."},{title:"Viewport 400px what is clamp(14px,5vw,24px)?",desc:"With viewport width 400px, what is the computed value of clamp(14px, 5vw, 24px)? Enter number only.",hint:"5vw = 400 * 0.05 = 20px. Check if it lies between min and max.",explanation:"5vw = 20px, which is between 14px and 24px, so result is 20px. clamp limits preferred value to min/max range."},{title:"What is correct order for clamp()?",desc:"Choose the correct syntax order for clamp().",hint:"Think smallest → fluid → largest.",explanation:"Correct is clamp(min, preferred, max). Example: clamp(16px, 4vw, 32px). Wrong order makes it always clamp to min or max.",options:["clamp(max, preferred, min)","clamp(min, preferred, max)","clamp(preferred, min, max)"]}]},{title:"Calc + Clamp",short:"calc",problems:[{title:"Make width min 200px, preferred calc(50% - 20px), max 600px",desc:"Combine clamp() and calc(): fluid width that is 50% minus 20px, but bounded between 200px and 600px.",hint:"width: clamp(200px, calc(50% - 20px), 600px); Note spaces inside calc!",explanation:"You can nest calc() inside clamp(). calc(50% - 20px) is half parent minus 20px, then clamped to 200-600px for safe responsive layout."},{title:"Container 800px, what is calc(100% - 40px)?",desc:"Parent width 800px, what is calc(100% - 40px) in px?",hint:"100% = 800px. Subtract 40px.",explanation:"800px - 40px = 760px. calc() allows mixing different units like % and px."},{title:"Can you nest clamp and calc?",desc:"Choose correct statement about nesting.",hint:"Both nestings are allowed in modern browsers.",explanation:"Both directions work: calc() inside clamp() and clamp() inside calc(). Example: clamp(200px, calc(10vw + 20px), 600px). Great browser support.",options:["Both calc inside clamp and clamp inside calc are possible","Only calc inside clamp possible","Nesting not possible"]}]},{title:"Flex & Grid",short:"flex/grid",problems:[{title:"Make flex-basis clamp(200px, 30%, 400px)",desc:"Flexible card layout: set flex-basis to clamp(200px, 30%, 400px) so it never gets too small or too large.",hint:"flex-basis: clamp(200px, 30%, 400px); or flex: 1 1 clamp(200px, 30%, 400px);",explanation:"Using clamp() for flex-basis keeps items at 30% but prevents them from shrinking below 200px or growing beyond 400px. Pair with flex grow/shrink."},{title:"Which defines responsive grid columns min 200px?",desc:"Which grid definition creates auto-responsive columns with min 200px?",hint:"Think auto-fit/fill + minmax. clamp inside minmax is also powerful.",explanation:"repeat(auto-fit, minmax(200px, 1fr)) makes columns at least 200px and share remaining space. You can also use clamp() inside minmax for finer control.",options:["repeat(auto-fit, minmax(200px, 1fr))","grid-template-columns: 200px 200px 200px","grid-template-columns: clamp(200px, 50%, 1fr)"]},{title:"1000px container, gap 20px, 3 items width?",desc:"Flex container 1000px, gap 20px, 3 equal items. What is one item width with calc (rounded)?",hint:"There are 2 gaps: 20*2=40. (1000-40)/3 = ?",explanation:"(1000-40)/3 = 960/3 = 320px. In practice: width: calc((100% - 40px) / 3)."}]},{title:"Position",short:"position",problems:[{title:"Sticky header top 0, padding clamp(12px, 2vw, 24px)",desc:"Create a sticky header: position sticky, top 0, and fluid padding clamp(12px, 2vw, 24px).",hint:"position: sticky; top: 0; padding: clamp(12px, 2vw, 24px);",explanation:"sticky stays within its parent container and sticks at top:0 when scrolling. Clamp padding makes spacing fluid across screen sizes."},{title:"Difference sticky vs fixed?",desc:"Choose correct difference explanation.",hint:"sticky is bound to parent, fixed to viewport.",explanation:"position: sticky sticks at given offset but releases when parent ends. fixed is always fixed to viewport.",options:["Both fixed to viewport","sticky is container-bound, fixed is viewport-fixed","fixed is container-bound, sticky is viewport-fixed"]},{title:"Height 800px viewport, clamp(10px, 5vh, 50px)?",desc:"Viewport height 800px, what is clamp(10px, 5vh, 50px)?",hint:"5vh = 800*0.05 = 40px. Between min and max?",explanation:"5vh = 40px, between 10px and 50px, so result 40px. vh is viewport height unit."}]},{title:"Transform & Animation",short:"transform",problems:[{title:"Make translateX clamp(0px, 5vw, 100px)",desc:"Move element fluidly on X axis: transform: translateX(clamp(0px, 5vw, 100px));",hint:"transform: translateX(clamp(0px, 5vw, 100px));",explanation:"You can use clamp() inside transform values. It moves by 5vw but never less than 0px or more than 100px, preventing excessive movement."},{title:"Best fluid animation using clamp?",desc:"How to correctly use clamp for ärung",answerLabel:"Beispiellösung",chapters:"Kapitel",codePlaceholder:"z.B. font-size: clamp(16px, 3vw, 28px);",numberPlaceholder:"Nur Zahl eingeben",typeCode:"Code",typeChoice:"Auswahl",typeNumber:"Rechnen",completed:"Fertig",of:"/",emptyChoice:"Bitte Option wählen"},chapters:[{title:"Clamp Grundlagen",short:"clamp",problems:[{title:"Mache Schriftgröße min 16px, bevorzugt 3vw, max 28px",desc:"Verwende clamp() für font-size, um flüssige Typografie mit Mindest- und Höchstgrenzen zu erstellen.",hint:"Reihenfolge clamp(min, bevorzugt, max). Beispiel: font-size: clamp(16px, 3vw, 28px);",explanation:"clamp() nimmt min, bevorzugt, max. Browser klemmt 3vw zwischen 16px und 28px ein. Lesbar auf kleinen, nicht zu riesig auf großen Bildschirmen."},{title:"Viewport 400px was ist clamp(14px,5vw,24px)?",desc:"Bei Viewport-Breite 400px, was ist der berechnete Wert von clamp(14px, 5vw, 24px)? Nur Zahl eingeben.",hint:"5vw = 400 * 0.05 = 20px. Liegt es zwischen min und max?",explanation:"5vw = 20px, liegt zwischen 14px und 24px, also Ergebnis 20px. clamp begrenzt den bevorzugten Wert."},{title:"Was ist die richtige Reihenfolge für clamp()?",desc:"Wähle die korrekte Syntax-Reihenfolge.",hint:"Denk klein → flüssig → groß.",explanation:"Korrekt ist clamp(min, bevorzugt, max). Bsp: clamp(16px, 4vw, 32px). Falsche Reihenfolge führt immer zu min oder max.",options:["clamp(max, bevorzugt, min)","clamp(min, bevorzugt, max)","clamp(bevorzugt, min, max)"]}]},{title:"Calc + Clamp",short:"calc",problems:[{title:"Mache Breite min 200px, bevorzugt calc(50% - 20px), max 600px",desc:"Kombiniere clamp() und calc(): flüssige Breite 50% minus 20px, aber begrenzt 200px–600px.",hint:"width: clamp(200px, calc(50% - 20px), 600px); Leerzeichen in calc beachten!",explanation:"Man kann calc() in clamp() verschachteln. calc(50% - 20px) ist halbes Elternelement minus 20px, dann auf 200–600px geklemmt für sicheres Responsive."},{title:"Container 800px, was ist calc(100% - 40px)?",desc:"Elternbreite 800px, was
