<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fotogram - Personal photo album gallery project showcasing CityCat Band.">
    <title>Fotogram - CityCat Band Foto Album</title>
    <link rel="icon" type="image/svg+xml" href="./icons/group.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body onload="showPhoto()">
    <header>
        <div class="header-container">
            <img src="./icons/mainlogo.svg" alt="Fotogram Logo">
        </div>
    </header>
    <main class="main-container">
        <h1>CityCat Band foto album</h1>

        <section class="main-gallery" id="gallery-root" aria-label="Photo Gallery"></section>

        <!-- Modal Overlay -->
        <section id="overlay" class="overlay d-none" onclick="closePhoto()" role="dialog" aria-modal="true" aria-label="Image detail view">

            <!-- Modal Box -->
            <div class="modal-box" onclick="event.stopPropagation()">
                <!-- Modal Header -->
                <div class="modal-header">
                    <span id="modal-filename" class="modal-filename"></span>
                    <button type="button" class="close-btn" onclick="closePhoto()" aria-label="Close modal"></button>
                </div>
                <!-- Modal Body -->
                <div class="modal-body">
                    <img id="overlay-img" class="modal-img" src="" alt="">
                </div>
                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button class="nav-btn" onclick="prevPhoto()" aria-label="Previous photo">
                        <img src="./icons/button-left.svg" alt="Previous">
                    </button>

                    <span id="photo-counter" class="photo-counter"></span>

                    <button class="nav-btn" onclick="nextPhoto()" aria-label="Next photo">
                        <img src="./icons/button-right.svg" alt="Next">
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <a href="https://developerakademie.com" target="_blank" rel="noopener noreferrer">
                <img src="./icons/footlogo.svg" alt="Developer Akademie Logo">
            </a>
            <p class="footer-copyright">© 2023 Developer Akademie GmbH</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
