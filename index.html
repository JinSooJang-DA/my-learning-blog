<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Room - Hub</title>
<style>
body{margin:0;background:#0b0b0f;color:#f5f5f7;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.wrap{max-width:900px;width:100%}
h1{font-size:2.6rem;margin:0} h1 span{background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:30px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:#17171d;border:1px solid #262631;border-radius:20px;padding:28px;text-align:center;transition:.2s}
.card:hover{transform:translateY(-4px)}
.btn{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:12px;background:#fff;color:#000;font-weight:800;text-decoration:none}
.btn.blue{background:#3b82f6;color:#fff}
.ext{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.ext a{padding:8px 14px;border-radius:999px;background:#1a1a20;border:1px solid #262631;color:#f5f5f7;text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">

</div>

<div style="font-size:2.5rem">⚡</div>
<h2>JS School</h2>
<p style="color:#9ca3af;font-size:.9rem">DOM + Fotogram projects</p>

</div>
</div>
