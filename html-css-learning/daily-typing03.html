<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            background-color: slateblue;
        }


        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            padding: 0 20px;
            background-color: paleturquoise;
            color: white;
        }

        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            flex: 1;
            height: 150px;
            background-color: indianred;
        }

        .cards1{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card1{
            flex: 1 1 300px;
            height: 150px;
            background-color: bisque;
        }
    </style>
</head>

<body>
    <div class="wrapper">CONTENT</div>

    <div class="header">
        <div>LOGO</div>
        <div>Menu</div>
    </div>

        <div class="cards">
            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
        </div>

        
    </div>

        <div class="cards1">
            <div class="card1">1</div>
            <div class="card1">2</div>
            <div class="card1">3</div>
        </div>
</body>

</html>
