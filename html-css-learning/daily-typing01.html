<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 300px;
            height: 120px;
            margin: 40px auto;
            background-color: tomato;
        }

        .box2{
            width: 200px;
            height: 200px;
            margin: 50px auto;
            background: skyblue;
        }

        .box3{
            width: 100px;
            height: 300px;
            margin: 50px auto;
            background: hotpink;
        }

        .box1, .box2, .box3{
            display: flex;
            justify-content: center;
            align-items: center;
            
        } 
    </style>
</head>
<body>
    <div class="box1">BOX</div>
    <div class="box2">BOX</div>
    <div class="box3">BOX</div>
</body>
</html>
